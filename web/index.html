<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Memory Builder</title>
<link rel="stylesheet" href="/static/styles.css?v=15" />
</head>
<body>
<header class="topbar">
  <div class="topbar-row topbar-identity">
    <div class="brand">
      <h1>Memory Builder</h1>
    </div>
    <div class="status">
      <span id="pill-opencode" class="pill">opencode: …</span>
      <span id="pill-barygraph" class="pill">barygraph: …</span>
      <a class="button-link" href="/pilot">Identity Pilot →</a>
    </div>
  </div>
  <div class="topbar-row topbar-form">
    <div class="menu">
      <button id="toggle-prompts" class="secondary" title="Show or hide the prompt editors">☰ Prompts</button>
      <label class="field inline">
        <span>Model</span>
        <select id="model"></select>
      </label>
      <label class="field inline">
        <span>Effort</span>
        <select id="variant"></select>
      </label>
      <label class="field inline">
        <span>Cycles</span>
        <input id="cycles" type="number" min="1" max="1000" value="3" />
      </label>
      <label class="field inline">
        <span>Output</span>
        <input id="out-name" type="text" placeholder="auto: output/runs/&lt;timestamp&gt;.jsonl" />
      </label>
      <div class="menu-actions">
        <button id="start" class="primary">Start run</button>
        <button id="stop" class="danger" disabled>Stop</button>
      </div>
    </div>
  </div>
</header>

<div id="drawer-backdrop" class="drawer-backdrop"></div>
<aside id="prompts-drawer" class="prompts-drawer" aria-hidden="true">
  <div class="drawer-head">
    <h2>Prompts</h2>
    <button id="close-prompts" class="secondary small" title="Close">✕</button>
  </div>
  <div class="version-box">
    <label class="field">
      <span>Prompt version</span>
      <select id="prompt-version"></select>
    </label>
    <div id="version-meta" class="muted small-note"></div>
  </div>
  <label class="field">
    <span>System prompt <em>(overrides the agent's default prompt)</em></span>
    <textarea id="system-prompt" rows="14" spellcheck="false"></textarea>
  </label>
  <label class="field">
    <span>Run prompt <em>(sent every cycle; define your JSONL spec here)</em></span>
    <textarea id="run-prompt" rows="18" spellcheck="false"></textarea>
  </label>
  <label class="field">
    <span>Version comment <em>(required when prompts change)</em></span>
    <input id="prompt-comment" type="text" maxlength="200" placeholder="e.g. Added optional tension with null" />
  </label>
  <div class="actions">
    <button id="save" class="secondary">Save prompts</button>
    <button id="reload" class="secondary" title="Reload prompts from the server (discard unsaved edits)">Reload</button>
  </div>
  <div class="muted small-note">Saved to <code>.opencode/agents/memory-builder.md</code>, <code>.state/prompts.json</code>, and <code>.state/prompt_versions.json</code>.</div>
</aside>

<main>
  <section class="panel tabs-panel">
    <div class="tabbar" role="tablist">
      <button class="tab active" data-tab="live" role="tab">Live <span id="run-state" class="muted"></span></button>
      <button class="tab" data-tab="results" role="tab">
        Results
        <span id="results-history-badge" class="tab-badge history" hidden>history</span>
        <span id="results-badge" class="tab-badge" hidden>new</span>
      </button>
      <button class="tab" data-tab="runs" role="tab">Previous runs</button>
      <button class="tab" data-tab="examples" role="tab">Examples <span id="examples-count" class="muted"></span></button>
    </div>
    <div class="tabpanes">
      <div id="pane-live" class="tabpane active" data-pane="live" role="tabpanel">
        <div class="pane-head"><span id="file-info" class="muted">No run yet.</span></div>
        <div id="live" class="live"></div>
      </div>
      <div id="pane-results" class="tabpane" data-pane="results" role="tabpanel">
        <div id="history-banner" class="history-banner" hidden>
          <div class="history-banner-text">
            <strong>History view</strong>
            <span id="history-name" class="muted"></span>
            <span class="muted">Live cycles are isolated from this run.</span>
          </div>
          <button id="back-to-live" class="secondary small" type="button">Back to live results</button>
        </div>
        <div id="results" class="results"></div>
        <div id="history-results" class="results" hidden></div>
      </div>
      <div id="pane-runs" class="tabpane" data-pane="runs" role="tabpanel">
        <div class="pane-head">
          <span id="runs-dir" class="muted"></span>
          <button id="refresh-runs" class="secondary small" type="button">Refresh</button>
        </div>
        <div id="runs" class="runs"></div>
      </div>
      <div id="pane-examples" class="tabpane" data-pane="examples" role="tabpanel">
        <div class="pane-head">
          <span class="muted">Stored in <code>output/examples.jsonl</code></span>
          <a class="button-link" href="/api/examples/download" download="examples.jsonl">Download JSONL</a>
        </div>
        <div id="examples" class="results"></div>
      </div>
    </div>
  </section>
</main>

<div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
<script src="/static/app.js?v=15"></script>
</body>
</html>
